name: Deploy to VPS

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'Rollback to specific SHA (optional)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  #-------------------------------------------------------------------------------
  # Test Stage
  #-------------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run typecheck
        run: npm run typecheck || true

      - name: Run tests
        run: npm test || echo "Tests placeholder - add actual tests"

      - name: Build application
        run: |
          npm run build --workspace=apps/backend || echo "Backend build placeholder"
          npm run build --workspace=apps/frontend || echo "Frontend build placeholder"

  #-------------------------------------------------------------------------------
  # Security Audit
  #-------------------------------------------------------------------------------
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: npm audit --audit-level=high || true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Upload audit results
        if: steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.json

  #-------------------------------------------------------------------------------
  # Build Docker Images
  #-------------------------------------------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    outputs:
      docker_tag: ${{ steps.meta.outputs.tags }}
      sha_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./infra/nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ github.sha }}

  #-------------------------------------------------------------------------------
  # Deploy to VPS
  #-------------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create deployment script
        run: |
          cat > deploy.sh << 'DEPLOYEOF'
          #!/bin/bash
          set -e

          APP_DIR="/opt/quran-academy"
          DEPLOY_TAG="${{ needs.build.outputs.sha_tag }}"
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE_NAME="${{ env.IMAGE_NAME }}"

          echo "Starting deployment..."
          echo "Deploy tag: $DEPLOY_TAG"

          cd $APP_DIR

          echo "Pulling latest docker-compose configuration..."
          git fetch origin dev
          git checkout origin/dev

          echo "Pulling Docker images..."
          docker pull $REGISTRY/$IMAGE_NAME/backend:$DEPLOY_TAG
          docker pull $REGISTRY/$IMAGE_NAME/frontend:$DEPLOY_TAG
          docker pull $REGISTRY/$IMAGE_NAME/nginx:$DEPLOY_TAG

          echo "Backing up current deployment..."
          if [ -f docker-compose.yml ]; then
            cp docker-compose.yml docker-compose.yml.backup
          fi

          echo "Creating docker-compose override..."
          cat > docker-compose.override.yml << 'COMPOSEEOF'
          services:
            backend:
              image: $REGISTRY/$IMAGE_NAME/backend:$DEPLOY_TAG
            frontend:
              image: $REGISTRY/$IMAGE_NAME/frontend:$DEPLOY_TAG
            nginx:
              image: $REGISTRY/$IMAGE_NAME/nginx:$DEPLOY_TAG
          COMPOSEEOF

          echo "Stopping existing containers..."
          docker compose down

          echo "Starting services..."
          docker compose up -d

          echo "Waiting for services to be healthy..."
          sleep 10

          echo "Checking service health..."
          docker compose ps

          echo "Cleaning up unused images..."
          docker image prune -f

          echo "Deployment completed successfully!"
          DEPLOYEOF
          chmod +x deploy.sh

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/quran-academy
            rsync -az --exclude='.git' --exclude='node_modules' --exclude='.next' ./ ubuntu@${{ secrets.VPS_HOST }}:/opt/quran-academy/
            cd /opt/quran-academy
            ./deploy.sh

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ Deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Quran Academy Deployment*\n• Environment: *Production*\n• Branch: *dev*\n• Commit: `${{ github.sha }}`\n• Status: *Success*"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ Deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Quran Academy Deployment*\n• Environment: *Production*\n• Branch: *dev*\n• Commit: `${{ github.sha }}`\n• Status: *FAILED*"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  #-------------------------------------------------------------------------------
  # Rollback on Failure
  #-------------------------------------------------------------------------------
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_tag || github.sha }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/quran-academy
            echo "Rolling back to previous deployment..."
            if [ -f docker-compose.yml.backup ]; then
              mv docker-compose.yml docker-compose.yml.failed
              mv docker-compose.yml.backup docker-compose.yml
            fi
            docker compose down
            docker compose up -d
            echo "Rollback completed"

      - name: Notify Slack on rollback
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "🔄 Rollback initiated",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Quran Academy Rollback*\n• Status: *Rollback to previous version*\n• Reason: *Deployment failure*"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
