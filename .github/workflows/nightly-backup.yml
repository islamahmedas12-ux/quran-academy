name: Nightly Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Backup type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - verify

jobs:
  backup:
    name: Run Nightly Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run backup script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/quran-academy
            ./infra/scripts/backup.sh

      - name: Upload backup metadata
        uses: actions/upload-artifact@v4
        with:
          name: backup-metadata-${{ github.run_number }}
          path: |
            /tmp/backup-metadata.json
          retention-days: 7

      - name: Notify Slack on Backup Success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "✅ Nightly backup completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Quran Academy Nightly Backup*\n• Status: ✅ Success\n• Run: #${{ github.run_number }}\n• Timestamp: ${{ github.event.head_commit.timestamp }}"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify Slack on Backup Failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "❌ Nightly backup failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Quran Academy Nightly Backup*\n• Status: ❌ Failed\n• Run: #${{ github.run_number }}\n• Action required: Check backup logs on VPS"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  verify-backup:
    name: Verify Backup Integrity
    runs-on: ubuntu-latest
    needs: backup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: List available backups
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/quran-academy
            ./infra/scripts/restore.sh list

      - name: Run restore verification
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/quran-academy
            # Verify latest PostgreSQL backup integrity
            latest_backup=$(ls -t /backups/postgres_*.sql.gz 2>/dev/null | head -1)
            if [ -n "$latest_backup" ]; then
              echo "Verifying: $latest_backup"
              gzip -t "$latest_backup" && echo "PostgreSQL backup: OK" || echo "PostgreSQL backup: FAILED"
            fi

            # Verify MinIO backup
            latest_minio=$(ls -t /backups/minio_*.tar.gz 2>/dev/null | head -1)
            if [ -n "$latest_minio" ]; then
              echo "Verifying: $latest_minio"
              tar -tzf "$latest_minio" > /dev/null 2>&1 && echo "MinIO backup: OK" || echo "MinIO backup: FAILED"
            fi
